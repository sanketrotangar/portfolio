<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="nv-geo-title nv-geo-desc">
  <title id="nv-geo-title">Geofence verification</title>
  <desc id="nv-geo-desc">The backend measures the Haversine distance from the incoming coordinate to the configured geofence centre. A point inside the radius is eligible for check-in; a point outside the radius is recorded as a breach.</desc>
  <defs>
    <style>
      .label { fill: #0F2A1F; font: 500 12px "DM Mono", monospace; }
      .sub { fill: #4A5E53; font: 400 10px "DM Mono", monospace; }
      .accent-label { fill: #5F7A0C; font: 500 10px "DM Mono", monospace; }
    </style>
  </defs>

  <circle cx="160" cy="118" r="78" fill="#E9F6B8" fill-opacity="0.55" stroke="#5F7A0C" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 5"/>
  <text class="accent-label" x="160" y="58" text-anchor="middle">configured radius</text>

  <circle cx="160" cy="118" r="5" fill="#0F2A1F"/>
  <text class="sub" x="160" y="140" text-anchor="middle">geofence centre</text>

  <circle cx="388" cy="176" r="6" fill="#0F2A1F"/>
  <circle cx="388" cy="176" r="13" fill="none" stroke="#A9C2B2" stroke-width="1.2"/>
  <text class="sub" x="388" y="205" text-anchor="middle">officer coordinate</text>

  <line x1="166" y1="123" x2="376" y2="170" stroke="#0F2A1F" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text class="accent-label" x="270" y="136" text-anchor="middle">Haversine distance</text>

  <rect x="292" y="26" width="172" height="46" rx="8" fill="#FFFFFF" stroke="#CADBCF" stroke-width="1"/>
  <text class="sub" x="378" y="45" text-anchor="middle">inside radius</text>
  <text class="label" x="378" y="62" text-anchor="middle">check-in eligible</text>

  <rect x="292" y="212" width="172" height="22" rx="8" fill="#FFFFFF" stroke="#CADBCF" stroke-width="1" transform="translate(0,-4)"/>
  <text class="sub" x="378" y="222" text-anchor="middle">outside radius → breach recorded</text>
</svg>
