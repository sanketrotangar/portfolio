<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-labelledby="nv-geo-title nv-geo-desc">
  <title id="nv-geo-title">Geofence verification</title>
  <desc id="nv-geo-desc">The backend measures the Haversine distance from the incoming coordinate to the configured geofence centre. A point inside the radius is eligible for check-in; a point outside the radius is recorded as a breach.</desc>
  <defs>
    <style>
      .label { fill: #0F2A1F; font: 500 12px "DM Mono", monospace; }
      .sub { fill: #4A5E53; font: 400 10px "DM Mono", monospace; }
      .accent-label { fill: #5F7A0C; font: 500 10px "DM Mono", monospace; }
    </style>
  </defs>

  <text class="accent-label" x="140" y="44" text-anchor="middle">configured radius</text>
  <circle cx="140" cy="124" r="70" fill="#E9F6B8" fill-opacity="0.55" stroke="#5F7A0C" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 5"/>

  <circle cx="140" cy="124" r="5" fill="#0F2A1F"/>
  <text class="sub" x="140" y="104" text-anchor="middle">geofence centre</text>

  <line x1="146" y1="128" x2="378" y2="198" stroke="#0F2A1F" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text class="accent-label" x="288" y="152" text-anchor="middle">Haversine distance</text>

  <circle cx="384" cy="200" r="6" fill="#0F2A1F"/>
  <circle cx="384" cy="200" r="13" fill="none" stroke="#A9C2B2" stroke-width="1.2"/>
  <text class="sub" x="384" y="229" text-anchor="middle">officer coordinate</text>

  <rect x="296" y="22" width="168" height="48" rx="8" fill="#FFFFFF" stroke="#CADBCF" stroke-width="1"/>
  <text class="sub" x="380" y="42" text-anchor="middle">inside radius</text>
  <text class="label" x="380" y="59" text-anchor="middle">check-in eligible</text>

  <rect x="296" y="82" width="168" height="48" rx="8" fill="#FFFFFF" stroke="#CADBCF" stroke-width="1"/>
  <text class="sub" x="380" y="102" text-anchor="middle">outside radius</text>
  <text class="label" x="380" y="119" text-anchor="middle">breach recorded</text>
</svg>
