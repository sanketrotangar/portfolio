<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="auto" role="img" aria-labelledby="kb-card-title kb-card-desc">
  <title id="kb-card-title">Knowledge Base Retrieval Flow</title>
  <desc id="kb-card-desc">Upload, Parse and Chunk, Embed, Postgres with RLS, Hybrid Retrieval, and Cited Answer</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--color-diagram-edge)" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--color-diagram-accent-border)" />
    </marker>
  </defs>

  <!-- Row 1: Upload -> Parse -> Embed -->
  <g class="diagram-node">
    <rect x="15" y="20" width="140" height="42" rx="8" fill="var(--color-diagram-node-bg)" stroke="var(--color-diagram-node-border)" stroke-width="1"/>
    <text x="85" y="46" text-anchor="middle" fill="var(--color-diagram-text)" font-family="DM Mono, monospace" font-size="11" font-weight="500">1. Upload Doc</text>
  </g>
  <path class="edge-path" d="M 155 41 L 189 41" stroke="var(--color-diagram-edge)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="diagram-node">
    <rect x="195" y="20" width="150" height="42" rx="8" fill="var(--color-diagram-node-bg)" stroke="var(--color-diagram-node-border)" stroke-width="1"/>
    <text x="270" y="46" text-anchor="middle" fill="var(--color-diagram-text)" font-family="DM Mono, monospace" font-size="11" font-weight="500">2. Parse &amp; Version</text>
  </g>
  <path class="edge-path" d="M 345 41 L 379 41" stroke="var(--color-diagram-edge)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="diagram-node">
    <rect x="385" y="20" width="140" height="42" rx="8" fill="var(--color-diagram-node-bg)" stroke="var(--color-diagram-node-border)" stroke-width="1"/>
    <text x="455" y="46" text-anchor="middle" fill="var(--color-diagram-text)" font-family="DM Mono, monospace" font-size="11" font-weight="500">3. Embed Chunks</text>
  </g>

  <!-- Curve from Embed down to Postgres -->
  <path class="edge-path" d="M 455 62 L 455 85 Q 455 95 445 95 L 345 95" stroke="var(--color-diagram-edge)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Row 2: Postgres -> Hybrid Retrieve -> Cited Answer -->
  <g class="diagram-node">
    <rect x="195" y="95" width="145" height="42" rx="8" fill="var(--color-diagram-node-bg)" stroke="var(--color-diagram-node-border)" stroke-width="1"/>
    <text x="267" y="121" text-anchor="middle" fill="var(--color-diagram-text)" font-family="DM Mono, monospace" font-size="11" font-weight="500">4. Postgres (RLS)</text>
  </g>
  <path class="edge-path" d="M 195 116 L 165 116" stroke="var(--color-diagram-edge)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="diagram-node">
    <rect x="15" y="95" width="144" height="42" rx="8" fill="var(--color-diagram-node-bg)" stroke="var(--color-diagram-node-border)" stroke-width="1"/>
    <text x="87" y="121" text-anchor="middle" fill="var(--color-diagram-text)" font-family="DM Mono, monospace" font-size="11" font-weight="500">5. Hybrid Rerank</text>
  </g>

  <!-- Curve from Hybrid Rerank down/right to Cited Answer (highlighted) -->
  <path class="edge-path" d="M 87 95 L 87 80 Q 87 72 97 72 L 375 72 Q 385 72 385 82 L 385 95" stroke="var(--color-diagram-accent-border)" stroke-width="1.5" fill="none" stroke-opacity="0.8" marker-end="url(#arrow-accent)"/>

  <g class="diagram-node node--highlight">
    <rect x="385" y="95" width="140" height="42" rx="8" fill="var(--color-diagram-accent-fill)" stroke="var(--color-diagram-accent-border)" stroke-width="1.5"/>
    <text x="455" y="121" text-anchor="middle" fill="var(--color-diagram-text)" font-family="DM Mono, monospace" font-size="11" font-weight="700">6. Cited Answer ✦</text>
  </g>
</svg>